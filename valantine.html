<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Icaa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe6f0,#ffd6ec,#fff0f6);
font-family:Poppins;
overflow:hidden;
}

/* petals */
.petal{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear infinite;
opacity:0.7;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}

/* card */
.card{
background:rgba(255,255,255,0.75);
backdrop-filter:blur(15px);
padding:35px;
border-radius:25px;
box-shadow:0 15px 50px rgba(255,105,180,0.4);
text-align:center;
width:90%;
max-width:380px;
display:none;
animation:fade 2s;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.title{
font-family:'Playfair Display';
font-size:28px;
color:#ff4da6;
margin-bottom:15px;
}

/* photo foto.jpg*/
.photo{foto.jpg
width:240px;
height:240px;
margin:auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 40px rgba(255,105,180,0.7);
animation:zoom 6s infinite alternate ease-in-out;
}foto.jpg

.foto.jpg{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}foto.jpg

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

.text{
margin-top:20px;
font-size:18px;
color:#444;
min-height:80px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff4da6;
color:white;
font-size:16px;
cursor:pointer;
}

/* envelope */
.envelope{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 40px rgba(255,105,180,0.4);
cursor:pointer;
}

</style>
</head>
<body>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-love-ambient-11079.mp3">
</audio>

<div class="envelope" onclick="openLetter()" id="envelope">
💌 Klik untuk membuka surat dari Arsyah
</div>

<div class="card" id="card">

<div class="title">Icaa ❤️</div>

<div class="photo">
<img src="Arsya-ica.jpg">
</div>

<div class="text" id="text"></div>

<button onclick="love()">Aku sayang kamu ❤️</button>

</div>

<script>

// petals
for(let i=0;i<20;i++){
let p=document.createElement("div");
p.className="petal";
p.innerHTML="🌸";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(p);
}

// open
function openLetter(){
music.play();
envelope.style.display="none";
card.style.display="block";
type();
}

// text
let message =
"Kamu cantik.\n\n" +
"Kamu spesial.\n\n" +
"Dan aku bersyukur bisa kenal kamu.\n\n" +
"— Arsyah ❤️";

let i=0;

function type(){
if(i<message.length){
text.innerHTML += message.charAt(i);
i++;
setTimeout(type,40);
}
}

// confetti
function love(){
confetti({
particleCount:200,
spread:120,
origin:{y:0.6}
});
}

</script>

</body>
</html>
