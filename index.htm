<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      max-width: 500px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
    }

    .heart {
      font-size: 80px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .btn {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: #ff4b5c;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff1e38;
    }

    .floating-hearts span {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: float 10s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-110vh); }
    }
  </style>
</head>
<body>

  <!-- Musik Romantis -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Valentine icaaaa </h1>
    <p>
      Untuk kamu icaa selalu ada di hatiku...<br>
      Terima kasih sudah menjadi bagian terindah dalam hidupku.<br><br>
      Aku sayang kamu, hari ini, besok, dan selamanya 💕
    </p>
    <button class="btn" onclick="alert('I Love You ❤️')">
      Klik kalau kamu sayang aku 😘
    </button>
  </div>

  <!-- Hati melayang -->
  <div class="floating-hearts">
    <span style="left:10%; animation-delay:0s;">❤️</span>
    <span style="left:30%; animation-delay:2s;">💖</span>
    <span style="left:50%; animation-delay:4s;">💘</span>
    <span style="left:70%; animation-delay:1s;">❤️</span>
    <span style="left:90%; animation-delay:3s;">💗</span>
  </div>

</body>
</html>
