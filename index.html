<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Icaa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe6f0,#ffd6ec,#fff0f6);
font-family:'Quicksand',sans-serif;
overflow:hidden;
}

/* petals */
.petal{
position:fixed;
top:-20px;
font-size:18px;
animation:fall linear infinite;
opacity:0.7;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}

/* envelope */
.envelope{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 40px rgba(255,105,180,0.4);
text-align:center;
cursor:pointer;
animation:fadeIn 2s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.card{
background:rgba(255,255,255,0.75);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
box-shadow:0 15px 50px rgba(255,105,180,0.4);
text-align:center;
width:90%;
max-width:420px;
display:none;
}

.title{
font-family:'Playfair Display',serif;
font-size:28px;
color:#ff4da6;
margin-bottom:10px;
}foto.jpg

.photo{foto.jpg
width:220px;
height:220px;
margin:auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 30px rgba(255,105,180,0.6);
margin-bottom:20px;
}foto.jpg

.photo img{
width:100%;
height:100%;
object-fit:cover;
}foto.jpg

.text{
font-size:18px;
color:#444;
min-height:100px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff4da6;
color:white;
font-size:16px;
cursor:pointer;
}

.hidden{display:none;}

</style>
</head>
<body>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-love-ambient-11079.mp3">
</audio>

<audio id="heartbeat" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_6c9c9bb5c1.mp3?filename=heartbeat-11034.mp3">
</audio>

<div class="envelope" onclick="openLetter()" id="envelope">
💌 Klik untuk membuka surat cinta
</div>

<div class="card" id="card">

<div class="title">Arsyah ❤️ Icaa</div>

<div class="photo">
<img src="foto.jpg">
</div>

<div class="text" id="loveText"></div>

<button onclick="celebrate()">Aku juga sayang kamu ❤️</button>
<button onclick="save()">Simpan kenangan 📸</button>

</div>

<script>

// petals
for(let i=0;i<20;i++){
let p=document.createElement("div");
p.className="petal";
p.innerHTML="🌸";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(p);
}

// open letter
function openLetter(){

music.play();
heartbeat.play();

document.getElementById("envelope").style.display="none";
document.getElementById("card").style.display="block";

typeWriter();
}

// romantic text
let text =
"Hai Icaa...\n\n" +
"Aku mungkin bukan orang sempurna,\n" +
tapi setiap hari aku selalu bersyukur karena ada kamu.\n\n" +
"Kamu adalah alasan aku tersenyum,\n" +
alasan aku semangat,\n" +
dan alasan hatiku terasa hangat.\n\n" +
"Aku nggak tahu masa depan seperti apa,\n" +
tapi aku tahu aku ingin menjalaninya bersama kamu.\n\n" +
— Arsyah ❤️";

let i=0;

function typeWriter(){
if(i<text.length){
document.getElementById("loveText").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter,40);
}
}

// confetti
function celebrate(){
confetti({
particleCount:300,
spread:120,
origin:{y:0.6}
});
}

// save
function save(){
html2canvas(document.body).then(canvas=>{
let a=document.createElement("a");
a.href=canvas.toDataURL();
a.download="arsyah-icaa-love-letter.png";
a.click();
});
}

</script>

</body>
</html>
