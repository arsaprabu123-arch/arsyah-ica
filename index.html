<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsyah 💖 Icaa</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe6f0,#ffd6ec,#fff5fa);
font-family:'Quicksand',sans-serif;
overflow:hidden;
}

/* floating petals */
.petal{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear infinite;
opacity:0.6;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}

.card{
background:rgba(255,255,255,0.7);
backdrop-filter:blur(15px);
padding:40px;
border-radius:30px;
box-shadow:0 15px 40px rgba(255,182,193,0.4);
text-align:center;
width:90%;
max-width:420px;
animation:fade 1.5s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.title{
font-family:'Playfair Display',serif;
font-size:28px;
color:#ff4da6;
margin-bottom:15px;
}

.photo-frame{
width:220px;
height:220px;
margin:0 auto 15px auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(255,105,180,0.4);
animation:zoom 6s infinite alternate ease-in-out;
opacity:0;
animation-delay:1s;
animation-fill-mode:forwards;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

.photo-frame img{
width:100%;
height:100%;
object-fit:cover;
}

.fade-in{
animation:appear 2s forwards;
}

@keyframes appear{
to{opacity:1;}
}
button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff66a3;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
margin-top:15px;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 20px pink;
}

.hidden{display:none;}

</style>
</head>
<body>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-love-ambient-11079.mp3">
</audio>

<div class="card" id="letter">
<p>💌 Sebuah kenangan untuk Icaa</p>
<button onclick="openLove()">Buka 🎀</button>
</div>

<div class="card hidden" id="main">
<div class="title">Arsyah 💖 Icaa</div>

<div class="photo-frame fade-in">
<img src= "foto.jpg" alt="Arsyah dan Icaa">
</div>

<p>
Aku bersyukur bisa punya momen bareng Icaa 🌸💕  
Dan aku nggak sabar bikin lebih banyak kenangan lagi 🩷
</p>

<button onclick="celebrate()">Selamanya 💖</button>
<button onclick="save()">Save Memory 📸</button>
</div>

<script>

// floating petals
for(let i=0;i<15;i++){
let p=document.createElement("div");
p.className="petal";
p.innerHTML="🌸";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(p);
}foto.jpg

// open letter
function openLove(){
document.getElementById("music").play();
document.getElementById("letter").classList.add("hidden");
document.getElementById("main").classList.remove("hidden");
}foto.jpg

// confetti
function celebrate(){
confetti({
particleCount:200,
spread:120,
origin:{y:0.6}
});
}

// save
function save(){
html2canvas(document.body).then(canvas=>{
let a=document.createElement("a");
a.href=canvas.toDataURL();
a.download="arsyah-icaa-photo-memory.png";
a.click();
});
}

</script>

</body>
</html>
